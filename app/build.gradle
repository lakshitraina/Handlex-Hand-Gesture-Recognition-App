plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.handlex'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.handlex"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    dependencies {
        // AndroidX Libraries
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'com.google.android.material:material:1.10.0'
        implementation 'androidx.activity:activity:1.8.1'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

        // CameraX for Camera Preview & Processing
        implementation "androidx.camera:camera-core:1.3.0"
        implementation "androidx.camera:camera-camera2:1.3.0"
        implementation "androidx.camera:camera-lifecycle:1.3.0"
        implementation "androidx.camera:camera-view:1.3.0"

        // Testing Libraries
        testImplementation 'junit:junit:4.13.2'
        androidTestImplementation 'androidx.test.ext:junit:1.1.5'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

        // Firebase BOM (Bill of Materials)
        implementation platform('com.google.firebase:firebase-bom:33.8.0')
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-auth'
        implementation 'com.google.firebase:firebase-firestore'

        // TensorFlow Lite for AI Model Inference
        implementation 'org.tensorflow:tensorflow-lite:2.14.0'
        // If you need only the API, uncomment the following line:
        // implementation 'org.tensorflow:tensorflow-lite-api:2.17.0'

        // ML Kit for Text Recognition
        implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

        // Glide for Image Loading
        implementation 'com.github.bumptech.glide:glide:4.16.0'
        annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

        implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.0.0' // For YouTube video playback
        implementation 'androidx.recyclerview:recyclerview:1.3.1'
    }

}